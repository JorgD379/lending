<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отрасль — ИТиС ЛАБ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── INDUSTRY PAGE ── */
    .ind-page { padding-top: 69px; }

    /* Breadcrumb + header */
    .ind-header {
      padding: 40px 0 48px;
      border-bottom: 1px solid var(--line);
    }
    .ind-title-row {
      display: flex;
      align-items: baseline;
      gap: 20px;
      margin-top: 16px;
    }
    .ind-page-title {
      font-family: var(--fh);
      font-weight: 900;
      font-size: clamp(32px, 5vw, 72px);
      line-height: 1.0;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    /* ── MASTER-DETAIL GRID ── */
    .ind-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      border-bottom: 1px solid var(--line);
      min-height: 600px;
    }
    @media(max-width:860px) {
      .ind-grid { grid-template-columns: 1fr; }
    }

    /* LEFT — sub-list */
    .ind-sub-list {
      border-right: 1px solid var(--line);
      background: var(--s1);
    }
    @media(max-width:860px) {
      .ind-sub-list { border-right: none; border-bottom: 1px solid var(--line); }
    }

    .sub-row {
      display: grid;
      grid-template-columns: 32px 1fr 16px;
      gap: 12px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      align-items: center;
      transition: background .15s, padding-left .18s;
    }
    .sub-row:hover { background: var(--s2); padding-left: 30px; }
    .sub-row.is-on {
      background: var(--bg);
      border-left: 2px solid #4ade80;
      padding-left: 22px;
    }
    .sub-row.is-on:hover { padding-left: 28px; }

    .sub-row-num {
      font-family: var(--fm);
      font-size: 10px;
      color: var(--m);
      letter-spacing: 0.06em;
    }
    .sub-row.is-on .sub-row-num { color: #4ade80; }
    .sub-row-name {
      font-family: var(--fh);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .sub-row-arr {
      font-family: var(--fm);
      font-size: 13px;
      color: var(--m);
      text-align: right;
    }

    /* RIGHT — detail panel */
    .ind-detail {
      padding: 48px 56px 64px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      background: var(--bg);
    }
    @media(max-width:860px) { .ind-detail { padding: 36px 24px; } }

    .det-sub-tag {
      font-family: var(--fm);
      font-size: 11px;
      color: #4ade80;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .det-sub-title {
      font-family: var(--fh);
      font-weight: 900;
      font-size: clamp(28px, 3.8vw, 52px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    /* Processes list */
    .proc-section-label {
      font-family: var(--fm);
      font-size: 11px;
      color: #4ade80;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0;
    }
    .proc-rows {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--line);
    }
    .proc-row-item {
      display: grid;
      grid-template-columns: 28px 1fr 20px;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      align-items: center;
      cursor: pointer;
      transition: padding-left .15s;
    }
    .proc-row-item:hover { padding-left: 8px; }
    .proc-row-item:hover .proc-row-num { color: #4ade80; }
    .proc-row-item:hover .proc-row-arr { color: var(--text); }

    .proc-row-num {
      font-family: var(--fm);
      font-size: 10px;
      color: var(--m);
      letter-spacing: 0.06em;
      transition: color .15s;
    }
    .proc-row-title {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }
    .proc-row-arr {
      font-family: var(--fm);
      font-size: 12px;
      color: var(--m);
      text-align: right;
      transition: color .15s;
    }

    /* Empty state */
    .det-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      padding: 80px 0;
      color: var(--m);
      font-family: var(--fm);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
    }
    .det-empty svg { opacity: 0.25; }

    /* ── PROCESS MODAL (no image) ── */
    .proc-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s, visibility .2s;
    }
    .proc-modal-overlay.on {
      opacity: 1;
      visibility: visible;
    }
    .proc-modal-box {
      background: var(--s1);
      border: 1px solid var(--line2);
      max-width: 720px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 48px;
      position: relative;
    }
    @media(max-width:640px) { .proc-modal-box { padding: 28px 20px; } }
    .proc-modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-family: var(--fm);
      font-size: 13px;
      color: var(--m);
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 8px;
      transition: color .15s;
    }
    .proc-modal-close:hover { color: var(--text); }
    .proc-modal-tag {
      font-family: var(--fm);
      font-size: 10px;
      color: #4ade80;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .proc-modal-title {
      font-family: var(--fh);
      font-weight: 900;
      font-size: clamp(20px, 2.8vw, 34px);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 32px;
    }
    .proc-modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }
    @media(max-width:560px) { .proc-modal-grid { grid-template-columns: 1fr; } }
    .proc-modal-cell {
      background: var(--s2);
      padding: 20px 22px;
    }
    .proc-modal-cell-label {
      font-family: var(--fm);
      font-size: 9px;
      color: var(--m);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .proc-modal-cell-text {
      font-size: 13.5px;
      color: var(--m2);
      line-height: 1.6;
    }
    .proc-modal-footer {
      display: flex;
      gap: 8px;
      margin-top: 28px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<div id="nav-root"></div>

<!-- Process Modal (no image) -->
<div class="proc-modal-overlay" id="procModalOverlay" onclick="closeProcModalOutside(event)">
  <div class="proc-modal-box" id="procModalBox">
    <button class="proc-modal-close" onclick="closeProcModal()">✕ ЗАКРЫТЬ</button>
    <div id="procModalContent"></div>
  </div>
</div>

<!-- Form modals -->
<div id="modals-root"></div>

<div class="ind-page">
  <!-- Header -->
  <div class="ind-header">
    <div class="wrap">
      <div class="breadcrumb">
        <a href="index.html">Главная</a>
        <span class="sep">/</span>
        <a href="industries.html">Решения по отраслям</a>
        <span class="sep">/</span>
        <span class="cur" id="indBreadcrumb">—</span>
      </div>
      <h1 class="ind-page-title" id="indTitle">—</h1>
    </div>
  </div>

  <!-- Master-detail -->
  <div style="max-width:1280px;margin:0 auto;">
    <div class="ind-grid" id="indGrid">
      <!-- Left: sub-industry list -->
      <div class="ind-sub-list" id="subList"></div>
      <!-- Right: detail panel -->
      <div class="ind-detail" id="detailPanel">
        <div class="det-empty">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="38" height="38" stroke="#444" stroke-width="1"/>
            <rect x="10" y="10" width="20" height="20" stroke="#444" stroke-width="1"/>
            <circle cx="20" cy="20" r="4" fill="#444"/>
          </svg>
          Выберите подотрасль
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>
  initComponents();
  initPage();

  const params = new URLSearchParams(window.location.search);
  const indId = parseInt(params.get('id'), 10);
  const ind = INDUSTRIES.find(i => i.id === indId);

  if (!ind) {
    window.location.href = 'industries.html';
  } else {
    document.title = `${ind.name} — ИТиС ЛАБ`;
    document.getElementById('indBreadcrumb').textContent = ind.name;
    document.getElementById('indTitle').textContent = ind.name;

    const subs = getSubs(indId);
    const subList = document.getElementById('subList');
    const detailPanel = document.getElementById('detailPanel');

    // Render sub-industry rows
    subList.innerHTML = subs.map((s, idx) => `
      <div class="sub-row" data-subid="${s.id}" onclick="selectSub(${s.id})">
        <div class="sub-row-num">/ ${String(idx + 1).padStart(2,'0')}</div>
        <div class="sub-row-name">${s.name}</div>
        <div class="sub-row-arr">→</div>
      </div>`).join('');

    // Select sub-industry and render detail panel
    window.selectSub = function(subId) {
      // Update active state
      document.querySelectorAll('.sub-row').forEach(r => {
        r.classList.toggle('is-on', parseInt(r.dataset.subid) === subId);
      });

      const sub = subs.find(s => s.id === subId);
      if (!sub) return;

      const procs = getProcs(indId, subId);

      detailPanel.innerHTML = `
        <div class="det-sub-tag">/ ${sub.name} · ${procs.length} процессов</div>
        <div class="det-sub-title">${sub.name}</div>
        <div>
          <div class="proc-section-label">/ Процессы</div>
          <div class="proc-rows">
            ${procs.length > 0
              ? procs.map((p, i) => `
                  <div class="proc-row-item" onclick="openProcModalNew(${indId},${subId},${p.id})">
                    <div class="proc-row-num">${String(i + 1).padStart(2,'0')}</div>
                    <div class="proc-row-title">${p.title}</div>
                    <div class="proc-row-arr">→</div>
                  </div>`).join('')
              : `<div style="padding:24px 0;font-family:var(--fm);font-size:11px;color:var(--m);letter-spacing:.08em;">Процессы не найдены</div>`
            }
          </div>
        </div>`;
    };

    // Auto-select first sub if exists
    if (subs.length > 0) {
      selectSub(subs[0].id);
    }
  }

  // ── PROCESS MODAL (no image) ──
  window.openProcModalNew = function(indId, subId, procId) {
    const procs = getProcs(indId, subId);
    const p = procs.find(x => x.id === procId);
    if (!p) return;

    document.getElementById('procModalContent').innerHTML = `
      <div class="proc-modal-tag">/ Процесс ${String(procId).padStart(2,'0')}</div>
      <div class="proc-modal-title">${p.title}</div>
      <div class="proc-modal-grid">
        <div class="proc-modal-cell">
          <div class="proc-modal-cell-label">Что контролировать</div>
          <div class="proc-modal-cell-text">${p.what}</div>
        </div>
        <div class="proc-modal-cell">
          <div class="proc-modal-cell-label">Почему это полезно</div>
          <div class="proc-modal-cell-text">${p.why}</div>
        </div>
        <div class="proc-modal-cell">
          <div class="proc-modal-cell-label">Результаты внедрения</div>
          <div class="proc-modal-cell-text">${p.results}</div>
        </div>
        <div class="proc-modal-cell">
          <div class="proc-modal-cell-label">Принцип работы ИИ</div>
          <div class="proc-modal-cell-text">${p.principle}</div>
        </div>
        <div class="proc-modal-cell">
          <div class="proc-modal-cell-label">Функции ИТиС ЛАБ</div>
          <div class="proc-modal-cell-text">${p.features}</div>
        </div>
        <div class="proc-modal-cell">
          <div class="proc-modal-cell-label">Минусы традиционных методов</div>
          <div class="proc-modal-cell-text">${p.traditional}</div>
        </div>
      </div>
      <div class="proc-modal-footer">
        <button class="btn btn-w btn-sm" onclick="closeProcModal();openForm('simple')">Обсудить этот процесс</button>
        <button class="btn btn-g btn-sm" onclick="closeProcModal()">Закрыть</button>
      </div>`;

    const overlay = document.getElementById('procModalOverlay');
    overlay.classList.add('on');
    document.body.style.overflow = 'hidden';
  };

  window.closeProcModal = function() {
    document.getElementById('procModalOverlay').classList.remove('on');
    document.body.style.overflow = '';
  };

  window.closeProcModalOutside = function(e) {
    if (e.target === document.getElementById('procModalOverlay')) {
      closeProcModal();
    }
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeProcModal();
  });
</script>
</body>
</html>
